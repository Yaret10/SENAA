<section class="section process"><div class="container"><div class="process-intro"><div class="section-heading"><span class="eyebrow">Así de simple</span><h2>Recupera la tranquilidad de un hogar que funciona.</h2></div><p>No necesitas trasladar tu equipo ni perder tiempo buscando soluciones. Nosotros vamos a ti.</p></div><div class="steps"><article *ngFor="let step of steps; let i = index"><span class="step-num">0{{ i + 1 }}</span><div class="step-icon">{{ i === 0 ? '⌁' : i === 1 ? '◌' : i === 2 ? '⌕' : i === 3 ? '⚙' : '✓' }}</div><h3>{{ step.title }}</h3><p>{{ step.text }}</p></article></div></div></section>
