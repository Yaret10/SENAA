<section class="section services" id="servicios"><div class="container"><div class="section-heading"><span class="eyebrow">Nuestros servicios</span><h2>Atención completa para los equipos que cuidan tu hogar.</h2><p>En cada equipo realizamos diagnóstico, reparación, mantenimiento preventivo y mantenimiento correctivo según sea necesario.</p></div><div class="service-grid"><article class="service-card" *ngFor="let service of services; let i = index" [style.background-image]="'linear-gradient(0deg, rgba(5,24,43,.94), rgba(5,24,43,.13)), url(' + service.image + ')' "><span class="service-icon">{{ icons[i] }}</span><div><h3>{{ service.name }}</h3><p>{{ service.summary }}</p><a [routerLink]="['/servicios', service.slug]" [attr.aria-label]="'Conocer la importancia del mantenimiento de ' + service.name">Ver mantenimiento y reparación <span>→</span></a></div></article></div></div></section>
