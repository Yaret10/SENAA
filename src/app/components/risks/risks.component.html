<section class="section risks"><div class="container"><div class="risks-heading"><div class="section-heading"><span class="eyebrow">Una revisión a tiempo</span><h2>Pequeñas señales hoy pueden evitar problemas mayores mañana.</h2></div><p>El objetivo no es alarmarte: es ayudarte a reconocer por qué una revisión periódica es una decisión práctica para tu hogar.</p></div><div class="risk-grid"><article *ngFor="let risk of risks"><header><i>{{ risk.icon }}</i><h3>{{ risk.equipment }}</h3></header><ul><li *ngFor="let item of risk.items"><span>•</span>{{ item }}</li></ul></article></div></div></section>
