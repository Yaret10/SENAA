<div class="topbar">
    <div class="container topbar-inner">
      <span>Atención a domicilio en Lima y alrededores</span>
      <div class="topbar-actions">
        <div class="social-links" aria-label="Redes sociales">
          <a [href]="config.tiktokLink" target="_blank" rel="noopener" aria-label="TikTok de SENAA" title="TikTok">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 3c.4 2.4 1.8 3.8 4.3 4v3.2c-1.5.1-2.8-.4-4.2-1.2v6.4c0 5.7-6.3 7.5-9.2 4.1-1.9-2.3-1.1-6.3 1.5-7.6 1-.5 2.1-.7 3.1-.5v3.3c-.5-.2-1.1-.1-1.6.1-1.5.7-1.4 3.1.2 3.6 1.1.4 2.5-.2 2.5-1.9V3h3.4z"/></svg>
          </a>
          <a [href]="config.instagramLink" target="_blank" rel="noopener" aria-label="Instagram de SENAA" title="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="instagram-dot" cx="17.4" cy="6.7" r="1"/></svg>
          </a>
          <a [href]="config.facebookLink" target="_blank" rel="noopener" aria-label="Facebook de SENAA" title="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.1 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H8v3.1h2.7v8h3.4z"/></svg>
          </a>
        </div>
        <a class="topbar-phone" [href]="config.phoneLink">{{ config.phoneDisplay }}</a>
  </div>
</div>
</div>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" routerLink="/" fragment="inicio" (click)="closeMenu()">
      <span class="brand-mark"><img src="/images/senaa_logo.jpeg" alt="Logo de SENAA"></span>
      <span>{{ config.name }}<small>{{ config.tagline }}</small></span>
    </a>
    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Abrir menú"><span></span><span></span><span></span></button>
    <nav [class.open]="menuOpen" aria-label="Navegación principal">
      <a routerLink="/" fragment="inicio" (click)="closeMenu()">Inicio</a><a routerLink="/" fragment="servicios" (click)="closeMenu()">Servicios</a><a routerLink="/" fragment="mantenimiento" (click)="closeMenu()">Mantenimiento</a><a routerLink="/" fragment="nosotros" (click)="closeMenu()">Nosotros</a><a routerLink="/" fragment="contacto" (click)="closeMenu()">Contacto</a>
      <a class="button whatsapp-button nav-cta" [href]="config.whatsappLink" target="_blank" rel="noopener" (click)="closeMenu()"><img class="whatsapp-icon" src="/images/whatsapp.svg" alt="" aria-hidden="true"> WhatsApp</a>
    </nav>
  </div>
</header>
